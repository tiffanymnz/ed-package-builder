name: Build Windows Portable

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Run tests
        run: python -m unittest discover -p "test_*.py" -v

      - name: Build portable application
        run: >
          python -m PyInstaller
          --noconfirm --clean --windowed --onedir
          --name ED_Package_Builder
          --add-data "Debris Progression template.docx;."
          --collect-submodules fitz
          --collect-submodules PIL
          ed_app.py

      - name: Test executable
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'smoke.json'
          $exe = Resolve-Path 'dist/ED_Package_Builder/ED_Package_Builder.exe'
          $process = Start-Process -FilePath $exe -ArgumentList @('--smoke-test', $report) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Executable failed' }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if ($result.status -ne 'PASS' -or !$result.app_frozen) {
            throw 'Packaged application smoke test failed'
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ED_Package_Builder_Windows_Portable
          path: dist/ED_Package_Builder/
          if-no-files-found: error
          retention-days: 14
